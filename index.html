<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sustainable Mulki · Interactive 3D City Plan</title>
<meta name="description" content="An interactive 3D model of Mulki, Dakshina Kannada: rooftop solar, rainwater harvesting, bioswales, permeable roads, geocell riverbanks and stilt homes. SDG 11 city plan.">
<meta name="theme-color" content="#061923">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta property="og:type" content="website">
<meta property="og:title" content="Sustainable Mulki · Interactive 3D City Plan">
<meta property="og:description" content="Explore the SDG 11 plan for Mulki in 3D: energy, water, roads and housing, with real numbers.">
<meta property="og:image" content="og.png">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{--teal:#2dd4bf;--amber:#f6b73c;--peri:#8ea2fd;--pink:#f472b6;--ink:#eaf6f8;--muted:#9fc0c9;--glass:rgba(12,40,54,.52);--glass-b:rgba(255,255,255,.2)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#061923;color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
#bg{position:fixed;inset:0;background:radial-gradient(1100px 700px at 72% 8%,#14586a 0%,#0b3040 42%,#061923 100%);transition:filter 1.2s}
body.rain #bg{filter:brightness(.62) saturate(.8)}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none;cursor:grab}
canvas#c.drag{cursor:grabbing}
canvas#c.hot{cursor:pointer}
.glass{background:var(--glass);border:1px solid var(--glass-b);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
body.moving .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(10,32,44,.84)}
.fade{transition:opacity .6s,transform .6s}
body.focus .hide-focus{opacity:0;pointer-events:none;transform:translateY(8px)}
button{font:inherit;color:inherit;cursor:pointer}

/* brand + tools */
.brand{position:fixed;left:20px;top:18px;padding:12px 18px 12px 12px;display:flex;gap:12px;align-items:center;z-index:5}
.logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(140deg,#2dd4bf,#1b86a0);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.logo svg{width:22px;height:22px}
.brand h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
.brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.tools{position:fixed;right:20px;top:18px;display:flex;gap:8px;z-index:5;transition:right .7s cubic-bezier(.2,.8,.2,1)}
body.focus .tools{right:408px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid var(--glass-b);background:var(--glass);transition:background .25s,border-color .25s,transform .2s}
.pill:hover{background:rgba(255,255,255,.16);transform:translateY(-1px)}
.pill.on{background:rgba(45,212,191,.22);border-color:rgba(45,212,191,.7)}
.pill svg{width:16px;height:16px}

/* legend + totals */
.legend{position:fixed;left:20px;top:92px;padding:10px;display:flex;flex-direction:column;gap:4px;z-index:4}
.legend h4{margin:2px 8px 4px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.legend button{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;border:0;background:transparent;font-size:13px;text-align:left;transition:background .2s,opacity .2s}
.legend button:hover{background:rgba(255,255,255,.1)}
.legend button.off{opacity:.38}
.legend i{width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 28%,transparent)}
.totals{position:fixed;left:20px;bottom:88px;padding:12px 16px;z-index:4;display:grid;grid-template-columns:repeat(3,auto);gap:4px 22px}
.totals b{font-size:19px;font-weight:700;color:var(--amber);display:block;line-height:1.15}
.totals span{font-size:11px;color:var(--muted)}
.hint{position:fixed;right:20px;bottom:88px;font-size:12px;color:var(--muted);padding:8px 14px;z-index:4;text-align:right}

/* dock */
.dock{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:6px;padding:8px;max-width:calc(100% - 24px);overflow-x:auto;z-index:5;scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
.dock button{display:flex;align-items:center;gap:8px;padding:9px 13px;border-radius:12px;border:1px solid transparent;background:transparent;font-size:13px;font-weight:600;white-space:nowrap;transition:background .2s,border-color .2s}
.dock button i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.dock button:hover{background:rgba(255,255,255,.12)}
.dock button.active{background:rgba(255,255,255,.17);border-color:color-mix(in srgb,var(--c) 70%,white 10%)}
.dock button.off{display:none}
body.focus .dock{left:calc(50% - 192px)}
.dock{transition:left .7s cubic-bezier(.2,.8,.2,1)}

/* pins */
#pins,#notes,#places{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.pin{position:absolute;left:0;top:0;pointer-events:auto;border:0;background:none;padding:0;width:44px;height:44px;will-change:transform;transition:opacity .5s}
.pin .core{position:absolute;inset:6px;border-radius:50%;display:grid;place-items:center;background:rgba(8,32,43,.82);border:1.5px solid var(--c);color:var(--c);box-shadow:0 6px 18px rgba(0,0,0,.4),0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent);transition:transform .25s}
.pin .core svg{width:18px;height:18px}
.pin .pulse{position:absolute;inset:6px;border-radius:50%;border:2px solid var(--c);animation:pulse 2.4s ease-out infinite}
.pin:hover .core{transform:scale(1.18)}
.pin .tag{position:absolute;left:50%;top:100%;margin-top:2px;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(8,32,43,.78);border:1px solid var(--glass-b);opacity:0;transition:opacity .2s;pointer-events:none}
.pin:hover .tag,.pin.hover .tag{opacity:1}
.pin.off{opacity:0;pointer-events:none}
body.focus .pin{opacity:0;pointer-events:none}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.1);opacity:0}}
.place{position:absolute;left:0;top:0;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.78);text-shadow:0 1px 6px rgba(0,0,0,.6);white-space:nowrap;transition:opacity .5s;will-change:transform}
.place.water{color:#a8ecf6;font-style:italic;letter-spacing:.14em}
.place.big{font-size:13px;font-weight:700;letter-spacing:.26em}
body.focus .place{opacity:0}
.note{position:absolute;left:0;top:0;opacity:0;transition:opacity .6s;will-change:transform;--c:#fff}
.note.show{opacity:1}
.note i{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px rgba(255,255,255,.2)}
.note b{position:absolute;top:0;width:16px;border-top:1.5px solid rgba(255,255,255,.7)}
.note.r b{left:5px}.note.l b{right:5px}
.note span{position:absolute;top:0;transform:translateY(-50%);white-space:nowrap;font-size:12px;font-weight:600;padding:5px 10px;border-radius:9px;background:rgba(8,32,43,.78);border:1px solid var(--glass-b);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.note.r span{left:21px}.note.l span{right:21px}

/* panel */
#panel{position:fixed;right:20px;top:72px;bottom:88px;width:368px;padding:22px 22px 18px;z-index:6;overflow:auto;transform:translateX(125%);transition:transform .75s cubic-bezier(.2,.8,.2,1);scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent}
body.focus #panel{transform:none}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.kick{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--c)}
.x{width:32px;height:32px;border-radius:50%;border:1px solid var(--glass-b);background:var(--glass);display:grid;place-items:center;font-size:15px}
.x:hover{background:rgba(255,255,255,.18)}
#panel h2{margin:4px 0 8px;font-size:26px;line-height:1.12;font-weight:750;letter-spacing:-.2px}
#panel p{margin:0 0 14px;font-size:14px;line-height:1.5;color:#cfe6ec}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{padding:10px 10px 9px;border-radius:13px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14)}
.stat b{display:block;font-size:18px;line-height:1.15;font-weight:750;color:var(--amber);letter-spacing:-.2px;overflow-wrap:anywhere}
.stat span{display:block;margin-top:3px;font-size:11px;line-height:1.3;color:var(--muted)}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:rgba(0,0,0,.25);margin-bottom:14px}
.seg:empty{display:none}
.seg button{flex:1;border:0;border-radius:9px;padding:8px 6px;font-size:13px;font-weight:600;background:transparent;color:var(--muted);transition:background .25s,color .25s}
.seg button.on{background:rgba(255,255,255,.18);color:#fff}
#panel h3{margin:4px 0 8px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
#panel ul{margin:0 0 14px;padding:0;list-style:none}
#panel li{position:relative;padding:0 0 9px 18px;font-size:13.5px;line-height:1.45;color:#e2f1f4}
#panel li::before{content:"";position:absolute;left:0;top:7px;width:7px;height:7px;border-radius:50%;background:var(--c)}
.cost{padding:12px 14px;border-radius:13px;background:rgba(246,183,60,.12);border:1px solid rgba(246,183,60,.4);font-size:13.5px;line-height:1.45;margin-bottom:12px}
.cost b{color:var(--amber)}
.nav{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.nav button{padding:8px 14px;border-radius:999px;border:1px solid var(--glass-b);background:var(--glass);font-size:13px;font-weight:600}
.nav button:hover{background:rgba(255,255,255,.18)}
.nav span{font-size:12px;color:var(--muted)}
#pNote{display:block;font-size:11.5px;line-height:1.4;color:var(--muted)}

/* loader */
#load{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#061923;transition:opacity .9s .1s,visibility 1s;text-align:center}
#load.done{opacity:0;visibility:hidden}
#load .ring{width:46px;height:46px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--teal);animation:spin 1s linear infinite;margin:0 auto 14px}
#load p{margin:0;color:var(--muted);font-size:13px;letter-spacing:.1em}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:820px){
  .tools,body.focus .tools{right:12px;top:84px}
  .legend,.totals,.hint{display:none}
  .brand p{display:none}
  #panel{left:12px;right:12px;top:auto;bottom:74px;width:auto;max-height:46vh;transform:translateY(135%);padding:16px}
  body.focus #panel{transform:none}
  #panel h2{font-size:21px}
  body.focus .dock{left:50%}
  .stats{gap:6px}.stat b{font-size:15px}
}
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="c" tabindex="0" aria-label="Interactive 3D model of the Sustainable Mulki plan"></canvas>
<div id="places"></div>
<div id="notes"></div>
<div id="pins"></div>

<div class="brand glass fade hide-focus">
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#06242c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M5 20V10l7-6 7 6v10"/><path d="M9 20v-6h6v6"/></svg></div>
  <div><h1>Sustainable Mulki</h1><p>SDG 11 · interactive 3D plan</p></div>
</div>

<div class="tools">
  <button class="pill" id="bRain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16a4 4 0 1 1 1-7.9A5 5 0 0 1 18 10a3.5 3.5 0 0 1-.5 7"/><path d="M9 20l1-3M13 20l1-3M17 20l1-3"/></svg>Monsoon</button>
  <button class="pill" id="bSpin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>Orbit</button>
  <button class="pill" id="bHome"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Map</button>
</div>

<div class="legend glass fade hide-focus" id="legend"><h4>Show</h4></div>

<div class="totals glass fade hide-focus">
  <div><b>₹167–218 Cr</b><span>programme, gross</span></div>
  <div><b>6,073</b><span>homes</span></div>
  <div><b>36.4 MWp</b><span>rooftop solar</span></div>
</div>
<div class="hint fade hide-focus">Drag to rotate · scroll to zoom · click a marker</div>

<nav class="dock glass" id="dock" aria-label="Plan elements"></nav>

<aside id="panel" class="glass" aria-live="polite">
  <div class="ph"><span class="kick" id="pKick"></span><button class="x" id="pClose" title="Back to map (Esc)" aria-label="Back to map">✕</button></div>
  <h2 id="pTitle"></h2>
  <p id="pDesc"></p>
  <div class="stats" id="pStats"></div>
  <div class="seg" id="pToggle"></div>
  <h3>How it works</h3>
  <ul id="pList"></ul>
  <div class="cost" id="pCost"></div>
  <div class="nav"><button id="pPrev">← Prev</button><span id="pCount"></span><button id="pNext">Next →</button></div>
  <small id="pNote"></small>
</aside>

<div id="load"><div><div class="ring"></div><p id="loadMsg">BUILDING MULKI…</p></div></div>
<noscript><p style="position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#061923;color:#eaf6f8;font:16px sans-serif;text-align:center;padding:24px">This 3D model needs JavaScript. Please enable it and reload.</p></noscript>
